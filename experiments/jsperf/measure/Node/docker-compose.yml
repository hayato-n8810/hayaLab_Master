# Node 実行時間計測コンテナ (最小マウント + ベンチ単位シャード並列)
# 計測に必要なパスのみを /workspace 配下へ同一相対構造でバインドし、
# 無関係なツリー (.git / 他の data・outputs / 他 experiments) からの干渉を避ける。
# 入力の measure ディレクトリは、各ハーネスが result.json を書き出すため rw。
#
# 16 シャードを別々の物理コアに pin して擬似並列で計測する (各ソケット 8 シャード)。同一ベンチ
# (ペア) は同一シャードに割り当てられる (run_measure.py --shard i --num-shards 16)。
# この機の構成: 物理 24 コア (12 コア x 2 ソケット / NUMA 2 ノード)、HT 有効 48 論理。
#   物理コア i = 論理 {i, i+24}。 NUMA0=物理0-11、NUMA1=物理12-23。
# 各シャードに 1 物理コア (両 HT 論理) を専有させ、ソケットを跨がない (メモリ局所性は first-touch)。
# 各ソケット物理 12 コア中 8 コアを使用し、残り 4 コアは OS/Docker/親プロセス用に予約。
#
# NODE_MEASURE_ARGS で run_measure.py への追加引数を全シャードに渡す
# (例: NODE_MEASURE_ARGS="--resume --redo-status error" で未完了分と error レコードのみ再計測)。
x-node-base: &node-base
  build:
    context: .
    dockerfile: Dockerfile
  image: jsperf-measure-node
  working_dir: /workspace
  environment:
    PYTHONUNBUFFERED: "1"
    UV_LINK_MODE: copy
  # NODE_PATH はイメージ側 /opt/npm/node_modules を指す (Dockerfile)
  volumes:
    # uv run が hayalab を解決するためのルート要素 (README.md は pyproject の readme 参照先)
    - ../../../../src:/workspace/src:ro
    - ../../../../pyproject.toml:/workspace/pyproject.toml:ro
    - ../../../../uv.lock:/workspace/uv.lock:ro
    - ../../../../README.md:/workspace/README.md:ro
    # 実行スクリプト (node_modules はイメージ側 /opt/npm にあるためここには不要)
    - ../../../../experiments/jsperf/measure/Node:/workspace/experiments/jsperf/measure/Node:ro
    # 入力 (measure ハーネス) + result.json 書き出し
    - ../../../../data/jsPerf/Node/measure:/workspace/data/jsPerf/Node/measure:rw
    # 集約結果の出力
    - ../../../../outputs/jsperf/measure/Node:/workspace/outputs/jsperf/measure/Node:rw

services:
  # --- NUMA0 (物理コア 0-7) ---
  bench-node-shard0:
    <<: *node-base
    container_name: jsperf-measure-node-0
    cpuset: "${NODE_SHARD0_CPUS:-0,24}"
    command: uv run python experiments/jsperf/measure/Node/run_measure.py --shard 0 --num-shards 16 ${NODE_MEASURE_ARGS:-}
  bench-node-shard1:
    <<: *node-base
    container_name: jsperf-measure-node-1
    cpuset: "${NODE_SHARD1_CPUS:-1,25}"
    command: uv run python experiments/jsperf/measure/Node/run_measure.py --shard 1 --num-shards 16 ${NODE_MEASURE_ARGS:-}
  bench-node-shard2:
    <<: *node-base
    container_name: jsperf-measure-node-2
    cpuset: "${NODE_SHARD2_CPUS:-2,26}"
    command: uv run python experiments/jsperf/measure/Node/run_measure.py --shard 2 --num-shards 16 ${NODE_MEASURE_ARGS:-}
  bench-node-shard3:
    <<: *node-base
