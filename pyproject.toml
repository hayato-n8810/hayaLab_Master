[project]
name = "hayalab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "hayato-n8810", email = "s276185@wakayama-u.ac.jp" }
]
requires-python = ">=3.13"
dependencies = [
    "apted>=1.0.3",
    "beautifulsoup4>=4.15.0",
    "html5lib>=1.1",
    "ijson>=3.5.1",
    "lxml>=6.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.0",
    "pandas>=3.0.3",
    "playwright>=1.61.0",
    "plotly>=6.7.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.15.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "zss>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.14.8",
]

[tool.ruff]
line-length = 200

[tool.ruff.format]
docstring-code-format = true
quote-style = "double"
exclude = ["**/__init__.py"]

[tool.ruff.lint]
select = [
    "F", # pyflakes
    "E", # pycodestyle
    "W", # pycodestyle warnings
    "I", # isort
    "D", # pydocstyle
    "N", # pep8-naming
]
exclude = ["**/__init__.py"]
ignore = [
    "D100", # undocumented-public-module
    "D107", # undocumented-public-init
    "D205", # blank-line-after-summary
    "D415", # ends-in-punctuation
    "E501", # Line too long
    "F403", # unable to detect undefined names
    "F405"  # undefined, or defined from star imports
]

[tool.ruff.lint.pydocstyle]
# docstringはgoogle style
convention = "google"

[tool.ruff.lint.per-file-ignores]
# テストファイルでは pytest 慣例に従い、メソッド docstring・loop 変数 L 等を許容
"**/tests/**/*.py" = ["D101", "D102", "D103", "D107", "N806", "E402"]
"**/test_*.py"     = ["D101", "D102", "D103", "D107", "N806", "E402"]
